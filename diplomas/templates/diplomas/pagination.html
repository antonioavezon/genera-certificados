{% if page_obj.paginator.num_pages > 1 %}
<nav aria-label="Páginas">
  <ul class="pagination">
    {% if page_obj.has_previous %}
      <li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if selected %}&estado={{ selected }}{% endif %}">Anterior</a></li>
    {% endif %}
    <li class="page-item disabled"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
    {% if page_obj.has_next %}
      <li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if selected %}&estado={{ selected }}{% endif %}">Siguiente</a></li>
    {% endif %}
  </ul>
</nav>
{% endif %}
